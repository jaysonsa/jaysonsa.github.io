<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <style>
    :root { color-scheme: light dark; --bg: #0b0d12; --fg: #e8eaf0; --muted: #9aa3b2; --accent: #f97316; }
    @media (prefers-color-scheme: light) { :root { --bg: #f4f5f7; --fg: #0f172a; --muted: #475569; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 0 16px; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, sans-serif; text-align: center; }
    h1 { margin: 0 0 8px; font-size: clamp(1.8rem, 5vw, 2.6rem); }
    p { margin: 0; color: var(--muted); }
    span { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Virtual office <span>under construction</span></h1>
    <p>A 3D portfolio is on the way.</p>
  </main>
</body>
</html>
